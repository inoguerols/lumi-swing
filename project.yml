name: LumiSwing

options:
  bundleIdPrefix: com.noguerol
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LumiSwing:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # Info.plist declarado en vez de autogenerado: `GENERATE_INFOPLIST_FILE` solo
    # admite claves sueltas por build setting, y la pantalla de arranque es un
    # diccionario.
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lumi Swing
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # ProMotion: sin esto iOS limita el juego a 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        # Mismo verde y misma luciérnaga que el menú, para que el paso de la
        # pantalla de arranque al juego no tenga costura.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noguerol.lumiswing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Solo iPhone, solo portrait: decision D-003 en docs/decisiones.md
        TARGETED_DEVICE_FAMILY: "1"

  LumiSwingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LumiSwing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Lo que ningún test unitario puede afirmar: que la app se abre y se juega.
  LumiSwingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LumiSwing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LumiSwing

schemes:
  LumiSwing:
    build:
      targets:
        LumiSwing: all
        LumiSwingTests: [test]
        LumiSwingUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumiSwingTests
        - LumiSwingUITests
