name: LumiSwing

options:
  bundleIdPrefix: com.noguerol
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: es
  knownRegions:
    - es
    - en
    - Base

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LumiSwing:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # Game Center va aquí y no como capability de Xcode: el .xcodeproj se
    # regenera en cada build de CI y perdía el entitlement (la revisión rechaza
    # la build si la versión tiene leaderboard y la build no trae la clave).
    entitlements:
      path: Sources/Resources/LumiSwing.entitlements
      properties:
        com.apple.developer.game-center: true
    # Info.plist declarado en vez de autogenerado: `GENERATE_INFOPLIST_FILE` solo
    # admite claves sueltas por build setting, y la pantalla de arranque es un
    # diccionario.
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lumi Swing
        # La versión sigue a MARKETING_VERSION. Tiene que declararse AQUÍ y no
        # editarse en el .plist: xcodegen reescribe ese archivo en cada generate
        # (también en CI) y sin esta property lo deja clavado en 1.0 — es lo
        # que hizo salir las builds 12-16 como v1.0 siendo la v1.1.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # El juego no usa cifrado propio. Sin esta clave, App Store Connect pregunta
        # por el cumplimiento de exportación en CADA subida y bloquea la compilación
        # hasta que respondes a mano.
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # ProMotion: sin esto iOS limita el juego a 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        # Mismo verde y misma luciérnaga que el menú, para que el paso de la
        # pantalla de arranque al juego no tenga costura.
        # Solo color, sin logo: la tarjeta del logo pintaba un recuadro oscuro
        # sobre el verde y el arranque parecía roto. El launch debe parecer la
        # primera pantalla de la app (HIG), y la primera pantalla es la noche.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noguerol.lumiswing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Solo iPhone, solo portrait: decision D-003 en docs/decisiones.md
        TARGETED_DEVICE_FAMILY: "1"

  LumiSwingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LumiSwing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Lo que ningún test unitario puede afirmar: que la app se abre y se juega.
  LumiSwingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LumiSwing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LumiSwing

schemes:
  LumiSwing:
    build:
      targets:
        LumiSwing: all
        LumiSwingTests: [test]
        LumiSwingUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumiSwingTests
        - LumiSwingUITests
